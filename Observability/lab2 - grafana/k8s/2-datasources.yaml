apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  # Filename must end in .yaml — Grafana scans this directory and loads all .yaml files
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        # uid must match the datasource uid referenced in every dashboard panel.
        # We pin it to "prometheus" so the dashboard JSON works without manual wiring.
        uid: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        jsonData:
          # Tell Grafana the scrape interval so $__rate_interval is calculated correctly
          timeInterval: "5s"
        editable: false
