apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  # provider.yaml tells Grafana WHERE to scan for dashboard JSON files.
  # The path must match the mountPath of the dashboards volume in 1-grafana.yaml.
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: "Lab Dashboards"
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
