# ---
# ServiceMonitor: Prometheus scrapes the Payment Processor /metrics
# Selector matches the app's Service label (app: payment-processor)
# ---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payment-processor
  namespace: monitoring
  labels:
    app: payment-processor
    # Required: Prometheus (release=monitoring) only scrapes ServiceMonitors with this label
    release: monitoring
spec:
  # jobLabel tells the Operator which Service label to use as the `job` label in Prometheus.
  # Without this, Prometheus defaults to the Service *name* (payment-processor-service).
  # With jobLabel: app, it reads the Service's `app` label → job="payment-processor".
  jobLabel: app
  selector:
    matchLabels:
      app: payment-processor
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
