# ---
# Grafana: UI for Tempo and Loki with pre-provisioned datasources.
# Datasources include derived fields so trace → log and log → trace
# navigation works automatically — no manual UI configuration needed.
# ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: chain-reaction
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          # "Traces to logs": when viewing a trace in Tempo, Grafana jumps
          # to matching Loki log lines. We use a custom query so the stream
          # selector uses the `app` label (set by our Promtail config) rather
          # than the default `service_name` label Grafana would auto-generate.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-2m"
            spanEndTimeShift: "2m"
            filterByTraceID: false
            filterBySpanID: false
            # Use tag-based matching: maps the OTel `service.name` resource attribute
            # to the Loki `app` label. Grafana generates {app="service-a"} for each span.
            # No template variable substitution needed — avoids the YAML provisioning
            # issue where ${...} variables are silently expanded to empty at load time.
            customQuery: false
            tags:
              - key: service.name
                value: app
          lokiSearch:
            datasourceUid: loki

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          # "Derived fields": when a Loki log line contains trace_id, Grafana
          # renders a clickable "TraceID" link that opens that trace in Tempo.
          # The regex matches the trace_id field in our JSON log format.
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"([a-f0-9]{32})"'
              name: TraceID
              url: "${__value.raw}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: chain-reaction
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: chain-reaction
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana
