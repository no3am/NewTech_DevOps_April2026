# ---
# Promtail: ships pod logs from the cluster to Loki for trace–log correlation.
# Optional: only needed if you want to jump from Tempo spans to Loki in Phase 3.
# Requires RBAC below so Promtail can discover pods via the Kubernetes API.
# ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: chain-reaction
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail-pods
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail-pods
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: chain-reaction
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: chain-reaction
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: chain-reaction
        # Static glob — watches every container log under the chain-reaction namespace.
        # Avoids kubernetes_sd_configs which has unreliable __path__ behaviour in Promtail 3.x.
        # Path format: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log
        static_configs:
          - targets:
              - localhost
            labels:
              namespace: chain-reaction
              __path__: /var/log/pods/chain-reaction_*/*/*.log
        pipeline_stages:
          - cri: {}
          # Extract the app name from the directory structure so each service
          # gets its own Loki stream label, e.g. app="service-a".
          - regex:
              source: filename
              expression: '/var/log/pods/chain-reaction_(?P<app>[a-z-]+)-[^_]+_[^/]+/[^/]+/\d+\.log'
          - labels:
              app:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: chain-reaction
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
      tolerations:
        - operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: chain-reaction
  labels:
    app: promtail
spec:
  clusterIP: None
  ports:
    - port: 3101
      name: http
  selector:
    app: promtail
